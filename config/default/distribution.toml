version = 3
allow_config_override = false
extension_manifests = ["../../src/managed-extensions/git-clone/pi-sandbox-extension.json"]

[platforms.linux]
config_dir = "/etc/pi-sandbox"
libexec_dir = "/usr/libexec/pi-sandbox"
launcher_path = "/usr/bin/pi-sandbox"
service_dir = "/usr/lib/systemd/system"
identity_socket_path = "/run/pi-sandbox-identity/broker.sock"
audit_socket_path = "/run/pi-sandbox-audit/collector.sock"

[platforms.linux.bubblewrap]
mode = "system"
path = "/usr/bin/bwrap"

[platforms.darwin]
config_dir = "/etc/pi-sandbox"
libexec_dir = "/usr/local/libexec/pi-sandbox"
launcher_path = "/usr/local/bin/pi-sandbox"
identity_socket_path = "/run/pi-sandbox-identity/broker.sock"
audit_socket_path = "/run/pi-sandbox-audit/collector.sock"

# Optional on macOS arm64 only, with a complete external runtime on macOS 26.0+.
# Native runtime integration and qualification are required before deployment.
# [platforms.darwin.smolvm]
# path = "/opt/smolvm-1.26.1/smolvm"
# version = "1.26.1"
