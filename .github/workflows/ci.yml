name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap fd-find ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install dependencies
        run: env -u NODE_ENV npm ci
      - name: Check source
        run: |
          env -u NODE_ENV npm run format:check
          env -u NODE_ENV npm run lint
          env -u NODE_ENV npm run typecheck
      - name: Test application
        run: |
          env -u NODE_ENV npm run test:unit
          env -u NODE_ENV npm run test:integration
          env -u NODE_ENV npm run test:e2e
          env -u NODE_ENV npm run test:build-composition
          env -u NODE_ENV npm run test:distribution
          env -u NODE_ENV npm run test:install
          env -u NODE_ENV npm run test:systemd
      - name: Test native broker
        run: env -u NODE_ENV npm run test:broker
      - name: Build
        run: env -u NODE_ENV npm run build
