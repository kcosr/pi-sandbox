config_version = 15
models_file = "/etc/pi-sandbox/models.json"

[codemode]
enabled = false

[mcp.servers]

[exports]
enabled = false

[sessions]
retention_days = 0

[audit]
enabled = false
facility = "local0"

[filesystem]
cwd_writable = true
hidden_paths = []
denied_paths = []

[execution]
backend = "bubblewrap"

[identity]
mode = "disabled"

[network]
mode = "none"

[environment.pi]

[environment.sandbox]

[environment.extensions]

[extensions]

[tools.read]
mode = "allow"
session_grant = "never"

[tools.grep]
mode = "allow"
session_grant = "never"

[tools.find]
mode = "allow"
session_grant = "never"

[tools.ls]
mode = "allow"
session_grant = "never"

[tools.write]
mode = "ask"
session_grant = "never"

[tools.edit]
mode = "ask"
session_grant = "never"

[tools.bash]
mode = "ask"
session_grant = "never"

[audit.tools]
read = false
grep = false
find = false
ls = false
write = true
edit = true
bash = true

[workspace]
default = "host"
allowed = ["host"]

[workspace.modes.host]
