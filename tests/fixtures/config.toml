config_version = 14
models_file = "/etc/pi-sandbox/models.json"

[codemode]
enabled = false

[mcp.servers]

[sessions]
retention_days = 0

[audit]
enabled = false
facility = "local0"

[filesystem]
cwd_default = "read_write"
cwd_allowed = ["read_write"]
hidden_paths = []
denied_paths = []

[execution]
backend = "bubblewrap"

[identity]
mode = "disabled"

[network]
mode = "none"

[environment.pi]

[environment.sandbox]

[environment.extensions]

[extensions]

[tools.read]
enabled = true
audit = false
read_only = { mode = "allow", session_grant = "never" }
read_write = { mode = "allow", session_grant = "never" }

[tools.grep]
enabled = true
audit = false
read_only = { mode = "allow", session_grant = "never" }
read_write = { mode = "allow", session_grant = "never" }

[tools.find]
enabled = true
audit = false
read_only = { mode = "allow", session_grant = "never" }
read_write = { mode = "allow", session_grant = "never" }

[tools.ls]
enabled = true
audit = false
read_only = { mode = "allow", session_grant = "never" }
read_write = { mode = "allow", session_grant = "never" }

[tools.write]
enabled = true
audit = true
read_only = { mode = "ask", session_grant = "never" }
read_write = { mode = "ask", session_grant = "never" }

[tools.edit]
enabled = true
audit = true
read_only = { mode = "ask", session_grant = "never" }
read_write = { mode = "ask", session_grant = "never" }

[tools.bash]
enabled = true
audit = true
read_only = { mode = "ask", session_grant = "never" }
read_write = { mode = "ask", session_grant = "never" }
