[package]
name = "pi-sandbox-audit-collector"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
