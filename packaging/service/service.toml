manifest_version = 1

# Deployment must provision protected files before enabling the unit.
[[listeners]]
id = "local_linux"
transport = "unix"
platform = "linux"
socket_path = "/run/pi-sandbox/service.sock"
audit_facility = "local0"
policy_file = "/etc/pi-sandbox-service/main/audit-only-policy.toml"

