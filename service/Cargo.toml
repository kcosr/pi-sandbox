[package]
name = "pi-sandbox-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=0.8.23"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
httparse = "=1.10.1"
base64 = "=0.22.1"
sha2 = "=0.10.9"
subtle = "=2.6.1"
crossbeam-channel = "=0.5.15"

[dev-dependencies]
rcgen = "=0.13.2"
time = "=0.3.41"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
